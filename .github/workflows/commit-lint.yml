name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?(!)?: .+$'
          fail=0
          while IFS= read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            # Skip merge/revert/fixup/squash commits
            if echo "$subject" | grep -qE '^(Merge|Revert|fixup!|squash!|amend!) '; then
              continue
            fi
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::Non-conventional commit ${sha:0:7}: $subject"
              fail=1
            else
              echo "OK ${sha:0:7}: $subject"
            fi
          done < <(git rev-list "$BASE_SHA".."$HEAD_SHA")
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Commit messages must follow Conventional Commits v1.0.0:"
            echo "  <type>[optional scope][!]: <description>"
            echo "  types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
